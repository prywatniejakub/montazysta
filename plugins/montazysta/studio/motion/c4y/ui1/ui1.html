<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>ui1 · UI motion</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700;800&family=Montserrat:wght@700;800;900&display=block&subset=latin-ext");
:root { --bg: #070708; --card: #141417; --card2: #1d1d22; --line: #2a2a31; --yel: #ffd60a; --txt: #f5f5f6; --mut: #8d8d97; --red: #ff3d3d;
  --d: "Montserrat", "Inter", sans-serif; --b: "Inter", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
body { font-family: var(--b); color: var(--txt); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--bg); will-change: transform, opacity, filter; }
.cam { position: absolute; inset: 0; transform-origin: 50% 48%; }
.a { position: absolute; }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 10, .30), rgba(255, 214, 10, 0) 68%); pointer-events: none; }
.vign { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); pointer-events: none; z-index: 40; }

/* kinetic text */
.k { position: absolute; white-space: nowrap; will-change: transform, opacity, filter; }
.sm { font: 600 62px/1 var(--b); color: #d9d9de; letter-spacing: -.01em; }
.big { font: 900 190px/.9 var(--d); letter-spacing: -.045em; }
.yel { color: var(--yel); text-shadow: 0 0 36px rgba(255, 214, 10, .55), 0 0 90px rgba(255, 214, 10, .25); }
.wht { color: #fff; text-shadow: 0 0 40px rgba(255, 255, 255, .22); }
.redg { color: var(--red); text-shadow: 0 0 40px rgba(255, 61, 61, .6), 0 0 100px rgba(255, 61, 61, .3); }

/* cards */
.card { position: absolute; background: var(--card); border: 1.5px solid var(--line); border-radius: 40px; box-shadow: 0 40px 90px rgba(0,0,0,.55); }
.bub { position: absolute; display: flex; align-items: center; gap: 18px; padding: 22px 30px 22px 22px; background: var(--card2); border: 1.5px solid var(--line); border-radius: 34px; font: 600 36px/1.15 var(--b); color: #ececef; box-shadow: 0 24px 60px rgba(0,0,0,.5); white-space: nowrap; }
.bub i { width: 62px; height: 62px; border-radius: 50%; flex: 0 0 62px; }
.av { width: 76px; height: 76px; border-radius: 50%; background: var(--yel); color: #111; display: flex; align-items: center; justify-content: center; font: 900 30px/1 var(--d); }
.btn { position: absolute; padding: 22px 40px; border-radius: 22px; background: #1877f2; color: #fff; font: 700 36px/1 var(--b); }
.cursor { position: absolute; width: 64px; height: 64px; z-index: 30; }
.ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 4px solid rgba(255,255,255,.8); opacity: 0; }
.chip { position: absolute; padding: 14px 24px; border-radius: 999px; background: #1b1b20; border: 1.5px solid var(--line); font: 600 32px/1 var(--b); color: var(--mut); white-space: nowrap; }

/* phone */
.phone { position: absolute; border-radius: 74px; background: #0c0c0e; border: 3px solid #34343b; box-shadow: 0 0 0 10px #18181c, 0 50px 120px rgba(0,0,0,.7); overflow: hidden; }
.phone .scr { position: absolute; inset: 14px; border-radius: 60px; overflow: hidden; background: #000; }
.phone .notch { position: absolute; left: 50%; top: 26px; width: 150px; height: 42px; margin-left: -75px; border-radius: 22px; background: #000; z-index: 5; }
.phone canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.aitag { position: absolute; right: 30px; top: 86px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.26); color: rgba(255,255,255,.5); font: 800 15px/37px var(--b); text-align: center; z-index: 6; }
.side { position: absolute; right: 22px; bottom: 380px; display: flex; flex-direction: column; gap: 34px; align-items: center; z-index: 6; }
.side svg { width: 58px; height: 58px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.side em { display: block; font: 700 22px/1 var(--b); font-style: normal; color: #fff; text-align: center; margin-top: 6px; }
.bar { position: absolute; left: 30px; right: 30px; bottom: 60px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); z-index: 6; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #fff; }
.heart { position: absolute; width: 54px; height: 54px; z-index: 7; }

/* ads card */
.row { display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0; border-top: 1.5px solid var(--line); font: 600 34px/1 var(--b); color: var(--mut); }
.row b { font: 800 50px/1 var(--d); color: #fff; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tog { position: absolute; right: 40px; top: 46px; width: 120px; height: 66px; border-radius: 33px; background: #3a3a42; }
.tog i { position: absolute; left: 6px; top: 6px; width: 54px; height: 54px; border-radius: 50%; background: #fff; }

/* notifications */
.nt { position: absolute; left: 70px; width: 940px; height: 156px; padding: 0 34px; display: flex; align-items: center; gap: 26px; border-radius: 40px; background: rgba(40, 40, 46, .86); border: 1.5px solid rgba(255,255,255,.09); box-shadow: 0 30px 70px rgba(0,0,0,.55); backdrop-filter: blur(20px); }
.nt .ic { width: 92px; height: 92px; flex: 0 0 92px; border-radius: 24px; background: var(--yel); display: flex; align-items: center; justify-content: center; }
.nt .ic svg { width: 52px; height: 52px; }
.nt .tx { flex: 1; min-width: 0; }
.nt .tx b { display: block; font: 800 36px/1.1 var(--b); color: #fff; }
.nt .tx span { display: block; margin-top: 8px; font: 500 32px/1.15 var(--b); color: #c9c9cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt em { align-self: flex-start; margin-top: 34px; font: 500 28px/1 var(--b); font-style: normal; color: #9a9aa3; }

/* process */
.node { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 5px solid #3a3a42; background: var(--bg); }
.pline { position: absolute; width: 6px; margin-left: -3px; border-radius: 3px; background: #26262c; overflow: hidden; }
.pline b { position: absolute; left: 0; right: 0; top: 0; background: var(--yel); box-shadow: 0 0 20px rgba(255,214,10,.7); }
.step { position: absolute; left: 200px; width: 800px; height: 196px; display: flex; align-items: center; gap: 34px; padding: 0 36px; border-radius: 40px; background: var(--card); border: 2px solid var(--line); }
.step .ic { width: 124px; height: 124px; flex: 0 0 124px; border-radius: 32px; background: #24242a; display: flex; align-items: center; justify-content: center; }
.step .ic svg { width: 64px; height: 64px; }
.step b { display: block; font: 800 50px/1.05 var(--d); letter-spacing: -.025em; color: #fff; }
.step span { display: block; margin-top: 10px; font: 500 32px/1.2 var(--b); color: var(--mut); }

/* light scene */
.lt { background: #ececee !important; }
.wcard { position: absolute; left: 100px; width: 880px; height: 176px; display: flex; align-items: center; gap: 34px; padding: 0 40px; border-radius: 40px; background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.08); }
.wcard .ic { width: 104px; height: 104px; flex: 0 0 104px; border-radius: 28px; background: #f0f0f2; display: flex; align-items: center; justify-content: center; }
.wcard .ic svg { width: 58px; height: 58px; }
.wcard .t { position: relative; font: 700 46px/1.1 var(--b); color: #111113; letter-spacing: -.015em; }
.wcard .t s { position: absolute; left: -6px; top: 52%; height: 7px; border-radius: 4px; background: #111113; text-decoration: none; }
.ycard { position: absolute; left: 100px; width: 880px; height: 260px; display: flex; align-items: center; gap: 40px; padding: 0 46px; border-radius: 48px; background: var(--yel); box-shadow: 0 40px 90px rgba(255, 190, 0, .35); }
.ycard .ic { position: relative; width: 150px; height: 150px; flex: 0 0 150px; border-radius: 40px; background: #111113; display: flex; align-items: center; justify-content: center; }
.ycard .ic svg { width: 84px; height: 84px; }
.ycard small { display: block; font: 700 40px/1 var(--b); color: #111113; opacity: .75; }
.ycard b { display: block; margin-top: 12px; font: 900 72px/1 var(--d); letter-spacing: -.04em; color: #111113; }
.ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 4px solid #111113; }

/* brand */
.logo { position: absolute; width: 230px; height: 230px; border-radius: 60px; background: #111113; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 70px rgba(0,0,0,.25); }
.logo svg { width: 120px; height: 120px; }
.pill { position: absolute; left: 50%; display: flex; align-items: center; gap: 18px; padding: 34px 60px; border-radius: 999px; background: var(--yel); color: #111113; font: 800 54px/1 var(--d); letter-spacing: -.02em; white-space: nowrap; box-shadow: 0 0 60px rgba(255,214,10,.45); }
.pill svg { width: 50px; height: 50px; }
</style>
</head>
<body>
<script src="timing.js"></script>
<script src="reel.js"></script>
<script>
"use strict";
const T = window.TIMING; window.DUR = T.DUR; window.DURATION = T.DUR; window.SFX = [];
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const mix = (a, b, u) => a + (b - a) * u;
const E = { lin: u => u, out: u => 1 - Math.pow(1 - u, 3), out4: u => 1 - Math.pow(1 - u, 4), io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2, in: u => u * u * u,
  back: u => { const c = 1.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); } };
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
function spring(dt, f = 2.2, z = .5) { if (dt <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt)); }
const sfx = (name, t, gain = -6, maxlen = null) => window.SFX.push([name, +t.toFixed(3), gain, maxlen]);
const LN = k => T.lines.find(l => l.key === k);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l").replace(/[^a-z0-9]/g, "");
function W(k, needle, nth = 0) { const n = norm(needle), hits = LN(k).words.filter(w => norm(w.w).startsWith(n)); if (!hits.length) throw new Error(`no "${needle}" in ${k}`); return hits[Math.min(nth, hits.length - 1)].t; }
const LS = k => LN(k).slot;
const LE = k => { const w = LN(k).words; return w[w.length - 1].e; };

const stage = document.createElement("div"); stage.id = "stage"; document.body.appendChild(stage);
function el(parent, cls, html, css) { const e = document.createElement("div"); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) Object.assign(e.style, css); parent.appendChild(e); return e; }
const px = v => typeof v === "number" ? v + "px" : v;
function at(e, x, y, w, h) { if (x != null) e.style.left = px(x); if (y != null) e.style.top = px(y); if (w != null) e.style.width = px(w); if (h != null) e.style.height = px(h); return e; }

// blur-in: the "After Effects" text entrance (fade + rise + de-blur + slight overshoot)
function bin(e, t, t0, o = {}) {
  const d = o.d ?? .32, dy = o.dy ?? 40, s0 = o.s0 ?? .92, base = o.base ?? "";
  if (t < t0) { e.style.opacity = o.dim ?? 0; e.style.filter = o.dim ? "none" : "blur(14px)"; e.style.transform = `${base} translateY(${o.dim ? 0 : dy}px) scale(${o.dim ? 1 : s0})`; return 0; }
  const u = P(t, t0, t0 + d, E.out4), sp = spring(t - t0, o.f ?? 2.4, o.z ?? .55);
  e.style.opacity = mix(o.dim ?? 0, 1, clamp((t - t0) / (d * .6)));
  e.style.filter = u > .98 ? "none" : `blur(${((1 - u) * 14).toFixed(2)}px)`;
  e.style.transform = `${base} translateY(${((1 - u) * dy).toFixed(1)}px) scale(${mix(s0, 1, sp).toFixed(4)})`;
  return u;
}
function bout(e, t, t0, d = .25, base = "") { if (t < t0) return; const u = P(t, t0, t0 + d, E.in); e.style.opacity = 1 - u; e.style.filter = `blur(${(u * 16).toFixed(1)}px)`; e.style.transform = `${base} scale(${mix(1, 1.08, u).toFixed(3)})`; }
function pop(e, t, t0, from = .5, f = 2.4, z = .5, base = "") { const s = t < t0 ? 0 : spring(t - t0, f, z); e.style.opacity = t < t0 ? 0 : clamp((t - t0) / .07); e.style.transform = `${base} scale(${mix(from, 1, s).toFixed(4)})`; return s; }

const ICO = {
  spark: (c = "#ffd60a") => `<svg viewBox="0 0 100 100"><path fill="${c}" d="M50 4C51.8 34 66 48.2 96 50C66 51.8 51.8 66 50 96C48.2 66 34 51.8 4 50C34 48.2 48.2 34 50 4Z"/></svg>`,
  phone: (c = "#111113") => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>`,
  chat: (c = "#fff") => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="2.8"/></svg>`,
  film: (c = "#fff") => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.2v5.6l4.6-2.8z" fill="${c}"/></svg>`,
  mega: (c = "#fff") => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.6 6a8.5 8.5 0 0 1 0 12"/></svg>`,
  ring: (c = "#fff") => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/><path d="M15 3.5a6 6 0 0 1 5.5 5.5M15 7a2.6 2.6 0 0 1 2 2"/></svg>`,
  cam: (c = "#8d8d97") => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg>`,
  heart: (c = "#fff") => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>`,
  comm: (c = "#fff") => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/></svg>`,
  share: (c = "#fff") => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M21.5 3 2.5 10.6l7 2.4 2.4 7z"/></svg>`,
  cursor: `<svg viewBox="0 0 32 32"><path d="M6 3l19 12.5-8.6 1.6 5 9.4-3.8 2-5-9.5L6 25z" fill="#fff" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  down: (c = "#111113") => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5.5 12.5L12 19l6.5-6.5"/></svg>`,
};

// ---------------------------------------------------------------- scenes + transitions
// tr = transition INTO this scene at its start: zoom (zoom-through), whip (vertical whip pan), wipe (circle reveal), cut
const SC = [];
function scene(a, z, tr, build, o = {}) { const root = el(stage, "scene" + (o.cls ? " " + o.cls : "")), cam = el(root, "cam"); const s = { a, z, tr, root, cam, o }; s.upd = build(cam, s, root) || (() => {}); root.style.visibility = "hidden"; SC.push(s); return s; }
const TD = { zoom: .34, whip: .3, wipe: .42, cut: 0 };
function render(t) {
  SC.forEach((s, i) => {
    const nx = SC[i + 1], outD = nx ? TD[nx.tr] : 0;
    const vis = t >= s.a && t < s.z + outD;
    s.root.style.visibility = vis ? "visible" : "hidden";
    if (!vis) return;
    let tf = "", op = 1, fl = "", clip = "none", zi = 1;
    const ui = P(t, s.a, s.a + TD[s.tr] || 1e-6, E.out4);
    if (i > 0 && t < s.a + TD[s.tr]) {           // incoming
      zi = 2;
      if (s.tr === "zoom") { tf = `scale(${mix(.62, 1, ui).toFixed(4)})`; op = clamp(ui * 1.6); fl = ui < .98 ? `blur(${((1 - ui) * 18).toFixed(1)}px)` : ""; }
      if (s.tr === "whip") tf = `translateY(${((1 - ui) * 1920).toFixed(1)}px)`;
      if (s.tr === "wipe") { const c = s.o.wc || [540, 960]; clip = `circle(${(ui * 2300).toFixed(0)}px at ${c[0]}px ${c[1]}px)`; }
    }
    if (nx && t >= s.z) {                        // outgoing
      const uo = P(t, s.z, s.z + outD, nx.tr === "zoom" ? E.in : E.out4);
      if (nx.tr === "zoom") { tf = `scale(${mix(1, 2.2, uo).toFixed(4)})`; op = 1 - uo; fl = `blur(${(uo * 22).toFixed(1)}px)`; }
      if (nx.tr === "whip") tf = `translateY(${(-uo * 1920).toFixed(1)}px)`;
    }
    s.root.style.transform = tf; s.root.style.opacity = op; s.root.style.filter = fl || "none"; s.root.style.clipPath = clip; s.root.style.zIndex = zi;
    s.upd(t - s.a, t);
  });
  grain(t);
  aiTag.style.opacity = t >= LS("b4") - .1 && t < LS("b5") - .08 ? 1 : 0;
  const lt7 = SC[7]; vg.style.opacity = lt7 && t >= lt7.a && t < lt7.z ? mix(1, .18, P(t, lt7.a, lt7.a + .3)) : 1;
}
window.render = render;

// film grain: one 256 px noise tile (light + dark specks, normal blending), shifted every frame (24 fps)
const gc = document.createElement("canvas"); gc.width = gc.height = 256;
const gx = gc.getContext("2d"), gim = gx.createImageData(256, 256); let seed = 7;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
for (let p = 0; p < gim.data.length; p += 4) { const v = rnd() < .5 ? 0 : 255; gim.data[p] = gim.data[p + 1] = gim.data[p + 2] = v; gim.data[p + 3] = Math.floor(rnd() * 22); }
gx.putImageData(gim, 0, 0);
const gr = el(stage, "", null, { position: "absolute", inset: "0", zIndex: 90, pointerEvents: "none", backgroundImage: `url(${gc.toDataURL()})`, backgroundSize: "256px 256px" });
function grain(t) { const f = Math.floor(t * 24); gr.style.backgroundPosition = `${(f * 97) % 256}px ${(f * 61) % 256}px`; }
const vg = el(stage, "vign"); vg.style.zIndex = 80;
const aiTag = el(stage, "aitag", "AI", { right: "64px", top: "84px", zIndex: 95 });

// ---------------------------------------------------------------- S1: hook "Masz firmę, która żyje z poleceń?"
const tB2 = LS("b2") - .05;
scene(0, tB2, "cut", (c) => {
  const g = at(el(c, "glow"), 40, 380, 1000, 1000);
  const w1 = at(el(c, "k sm", "Masz"), 150, 615);
  const w2 = at(el(c, "k big yel", "firmę,"), 128, 690);
  const w3 = at(el(c, "k sm", "która żyje z"), 560, 900);
  const w4 = at(el(c, "k big wht", "poleceń?"), 128, 985); w4.style.fontSize = "176px";
  const bubs = [["Polecam ich!", 120, 360, "#ffd60a"], ["Znasz dobrego fachowca?", 330, 1250, "#7c8cff"], ["Daj numer, zadzwonię", 90, 1420, "#3ddc97"]]
    .map(([tx, x, y, col]) => { const b = at(el(c, "bub", `<i style="background:${col}"></i>${tx}`), x, y); return b; });
  const tp = W("b1", "polecen");
  bubs.forEach((b, i) => sfx("POP", tp + .06 + i * .14, -13));
  return (lt, t) => {
    const u = clamp(lt / 2);
    c.style.transform = `perspective(1800px) rotateY(${mix(-7, 3, E.io(u)).toFixed(2)}deg) rotateX(${mix(4, 1, u).toFixed(2)}deg) scale(${mix(1, 1.07, E.io(u)).toFixed(4)})`;
    g.style.opacity = .7 + .3 * Math.sin(t * 2);
