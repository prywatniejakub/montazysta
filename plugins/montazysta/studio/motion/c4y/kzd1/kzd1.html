      if (!on) return; const v = ease((t - g.a) / .22);

        const b = back((t - g.a) / .34), out = clamp((t - (g.z - .12)) / .12);

        g.ws.forEach(({ s, w }, i) => { const a0 = i ? w.t - .05 : g.a, wv = ease((t - a0) / .16), act = t >= w.t - .03 && t < w.e + .02;
          const pop = act ? Math.sin(clamp((t - w.t + .03) / .22) * Math.PI) * .07 : 0;
