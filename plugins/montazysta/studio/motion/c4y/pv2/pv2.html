<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>pv2 · Kupujesz go z powrotem?</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<link rel="stylesheet" href="../lib/prem.css">
<link rel="stylesheet" href="../pv/pv.css">
</head>
<body>
<script src="../clips/manifest.js"></script>
<script src="timing.js"></script>
<script src="../lib/c4y.js"></script>
<script src="../lib/prem.js"></script>
<script>window.ACC = "#1f7cff"; window.ACC_BOX = 1;</script>
<script src="../pv/pv.js"></script>
<script>
const DUR = T.DUR, S = k => LS(k);
const END = "blur(6px) brightness(.58) saturate(1.05)";
const tBo = W("b2", "bo"), tWiec = W("b5", "wieczorem"), tZat = W("b6", "zatrzymuje"), tWyk = W("b6", "wykorzystujesz"), tUmow = W("b7", "Umów");
const SHOTS = [
  { k: "img", s: "dom_dzien", a: 0, b: S("b2") - .04, z0: 1.0, z1: 1.14, ax0: .45, ay0: .68, ay1: .6,
    glow: [{ x: 905, y: 1385, r: 120, c: "#fff2c4", star: 1, pulse: .6, o: .75 }, { x: 1040, y: 1330, r: 70, c: "#fff2c4", pulse: .9, o: .6, a: .6 }] },
  { k: "clip", s: "pv_panday", a: S("b2") - .04, b: tBo - .04, z0: 1.04, z1: 1.12, tr: "whip" },
  { k: "img", s: "dom_dzien", a: tBo - .04, b: S("b3") - .04, z0: 1.3, z1: 1.38, ax0: .3, ay0: .62, mir: 1 },
  { k: "img", s: "dom_dzien", a: S("b3") - .04, b: S("b4") - .04, z0: 1.02, z1: 1.1, ay0: .64, tr: "fade", fd: .3, blend: { s: "dom_wieczor", a: S("b3") + .2, b: S("b3") + 1.5 } },
  { k: "img", s: "dom_wieczor", a: S("b4") - .04, b: S("b5") - .04, z0: 1.22, z1: 1.32, ax0: .35, ay0: .6, f: "brightness(.6)" },
  { k: "split", s: "dom_dzien", s2: "dom_wieczor", a: S("b5") - .04, b: S("b6") - .04, z0: 1.06, z1: 1.12, ay0: .66, f: "brightness(.9)", tr: "whip" },
  { k: "img", s: "garaz_magazyn", a: S("b6") - .04, b: S("b7") - .04, z0: 1.04, z1: 1.16, ax0: .7, ay0: .5,
    glow: [{ x: 700, y: 1335, r: 40, c: "#2fe08a", a: S("b6") + .35, pulse: .5 }], tr: "whip" },
  { k: "img", s: "dom_wieczor", a: S("b7") - .04, b: DUR + 1, z0: 1.08, z1: 1.16, ay0: .62, f: END, tr: "fade", fd: .45 },
];
scene(0, DUR + 1, (c) => {
  const draw = pvShots(c, SHOTS);
  el(c, "pv-shade"); el(c, "pv-vig");
  const sun = pvDN(c, "sun", "DZIEŃ", "oddajesz <u>tanio</u>", "↓", 330);
  const moon = pvDN(c, "moon", "WIECZÓR", "kupujesz <u>drożej</u>", "↑", 560);
  const bat = pvBat(c);
  const cards = pvCards(c, [
    { a: 0, z: S("b2") - .04, now: 1, t: "ODDAJESZ SWÓJ / PRĄD *DO *SIECI?", size: 100, y: 280 },
    { a: S("b2") - .04, z: S("b3") - .04, t: "W dzień nikt / go nie *zużywa", cls: "s", y: 280 },
    { a: S("b3"), z: S("b4") - .04, t: "A *WIECZOREM…", size: 110, y: 300 },
    { a: S("b4") - .04, z: S("b5") - .04, t: "KUPUJESZ GO / *Z *POWROTEM?", cls: "mid", size: 108, y: 720 },
    { a: S("b6") - .04, z: S("b7") - .04, t: "Zatrzymaj swoją / energię *w *domu", cls: "s", y: 260 },
  ]);
  const end = pvEnd(c, "Umów analizę instalacji");
  sfx("IMP_SOFT", S("b4") - .04, -18); sfx("CLICK", tUmow, -18);
  return (lt, t) => {
    draw(t); cards(t);
    sun(t, S("b5") + .1, S("b6") - .04); moon(t, tWiec - .05, S("b6") - .04);
    bat(t, tZat, S("b7") - .04, SHOTS[6], 768, 1990, tWyk);
    end(t, S("b7") - .04, tUmow);
  };
}, { push: 0, cut: true });
boot("pv2.m4a");
</script>
</body>
</html>
