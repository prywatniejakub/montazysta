<!doctype html>
<html lang="pl">

<link rel="stylesheet" href="../lib/c4y.css">
<style>

.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

.tk { position: absolute; left: 40px; right: 40px; text-align: center; }
.tk span { display: inline; background: #fff; color: #111; font: 800 64px/1.42 var(--d); letter-spacing: -.02em; padding: 6px 22px; border-radius: 18px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.tk.red span { background: var(--brand); color: #fff; }
.tk.big span { font-size: 80px; }
.pin { position: absolute; left: 50%; display: inline-flex; align-items: center; gap: 12px; height: 84px; padding: 0 30px; border-radius: 42px; background: rgba(0,0,0,.62);
  color: #fff; font: 800 42px/1 var(--d); white-space: nowrap; }
.rw { position: absolute; left: 50%; top: 860px; display: inline-flex; align-items: center; gap: 18px; padding: 26px 44px; border-radius: 24px; background: rgba(0,0,0,.72); color: #fff; font: 900 74px/1 var(--d); white-space: nowrap; }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 3px, rgba(0,0,0,0) 3px 7px); opacity: 0; }
.stamp { position: absolute; left: 640px; top: 240px; width: 340px; height: 340px; border-radius: 50%; border: 16px solid var(--brand); color: var(--brand);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font: 900 118px/1 var(--d); letter-spacing: -.05em; background: rgba(255,255,255,.9); }
.stamp small { font: 900 40px/1 var(--d); letter-spacing: .12em; margin-top: 8px; }

  -webkit-text-stroke: 16px #000; paint-order: stroke fill; text-shadow: 0 16px 50px rgba(0,0,0,.45); }
.hand { position: absolute; top: 760px; font-size: 200px; line-height: 1; filter: drop-shadow(0 10px 24px rgba(0,0,0,.4)); }
.brandend { position: absolute; left: 50%; top: 1300px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.brandend b { display: block; padding: 18px 40px; border-radius: 22px; background: #000; color: #fff; font: 900 86px/1 var(--d); letter-spacing: -.03em; white-space: nowrap; }
.brandend b i { font-style: normal; color: var(--brand); }
.brandend em { font-style: normal; padding: 14px 30px; border-radius: 40px; background: #fff; color: #111; font: 800 44px/1 var(--d); white-space: nowrap; }

</head>
<body>
<script src="../clips/manifest.js"></script>
<script src="timing.js"></script>
<script src="../lib/c4y.js"></script>
<script>
const DUR = T.DUR;
const FX = "C:/Users/komputer/Desktop/Youtube/motion/kuba/assets/sfx/";
const S1 = 1.8, S2 = 2.75, S3 = 4.05, S4 = 5.25, S5 = 6.55, S6 = 11.0, S7 = 13.3, TEN = 8.55;
// [klip, od, do, zoom start, zoom koniec, tempo]
const CUTS = [
  ["fGirlA", 0, S1, 1.14, 1.06, 1],
  ["fOrder", S1, S2, 1.02, 1.1, 1],
  ["fPass", S2, S3, 1.1, 1.02, 1.08],
  ["fBowl", S3, S4, 1.04, 1.16, 1.15],
  ["fMom", S4, S5, 1.1, 1.18, 1.08],
  ["fGirlB", S5, S6, 1.06, 1.2, 1],
  ["fDad", S6, S7, 1.08, 1.0, 1.2],
  ["fKids", S7, DUR + 1, 1.0, 1.12, .45],
];
const TXT = [  // [html, od, do, y, klasa]
  ["<span>Najszczersza recenzja</span><br><span>kebaba w Goczałkowicach 👇</span>", -1, S1, 250, ""],
  ["<span>Zamówienie leci 🌯</span>", S2, S3, 300, ""],
  ["<span>Kebab box 🤤</span>", S3, S4, 300, ""],
  ["<span>Mama: gryz kontrolny 🧐</span>", S4, S5, 300, ""],
  ["<span>Jury ocenia…</span>", S5, TEN, 300, ""],
  ["<span>Oblizuje palce</span><br><span>= najwyższa ocena</span>", TEN, S6, 1420, "red"],
  ["<span>Tata: „Mówiłem.” 😎</span>", S6, S7, 300, "big"],
];

scene(0, DUR + 1, (c) => {
  const cv = el(c, "full", `<canvas width="1080" height="1920"></canvas>`).firstChild, ctx = cv.getContext("2d");
  const fr = {}; CUTS.forEach(k => { fr[k[0]] = useClip(k[0]); });
  el(c, "shade");
  const scan = el(c, "scan");
  const tx = TXT.map(([h, a, z, y, k]) => { const e = at(el(c, "tk " + k, h), null, y); e.a = a; e.z = z; return e; });
  const pin = at(el(c, "pin", `📍 SIX SEVEN · Goczałkowice`), null, 1640);
  const rw = el(c, "rw", `⏪ 5 minut wcześniej`);
  const stamp = el(c, "stamp", `10/10<small>JURY</small>`);
  const meme = el(c, "meme", `6️⃣7️⃣`);
  const h1 = at(el(c, "hand", "🤚"), 230, null), h2 = at(el(c, "hand", "🤚"), 650, null);
  const be = el(c, "brandend", `<b>SIX <i>SEVEN</i> Street Food</b><em>📍 Goczałkowice · Wpadaj!</em>`);
  const fl = el(c, "flash");
  // dźwięki
  sfx("POP", 0, -10); sfx(FX + "record_scratch.mp3", S1 - .02, -6); sfx("WH_SWING", S2 - .05, -12);
  [S3, S4].forEach(x => sfx("POP", x, -12)); sfx("DING", S5 + .05, -14);
  sfx(FX + "vine_boom.mp3", TEN, -5); sfx("POP", S6 + .05, -10); sfx(FX + "vine_boom.mp3", S7, -7); sfx("POP", S7 + .9, -12);
  return (lt, t) => {
    const k = CUTS.find(x => t >= x[1] && t < x[2]) || CUTS[CUTS.length - 1];
    const f = fr[k[0]], u = clamp((t - k[1]) / Math.max(.3, k[2] - k[1]));
    let z = mix(k[3], k[4], E.io(u)), dx = 0, dy = 0;
    if (t - k[1] < .1) z += (1 - (t - k[1]) / .1) * .05;  // „punch” na cięciu
    if (t >= TEN && t < TEN + .35) { z += .14 * (1 - (t - TEN) / .35); dx = Math.sin(t * 95) * 14; dy = Math.cos(t * 80) * 10; }  // trzęsienie na 10/10
    if (f.length) {
      let i = Math.round((t - k[1]) * 30 * (k[5] || 1));
      if (k[0] === "fOrder") i = Math.round(f.length - 1 - (t - k[1]) / (S2 - S1) * (f.length - 1) * .5);  // przewijanie wstecz na starcie wspomnienia
      i = Math.min(f.length - 1, Math.max(0, i)); const im = f[i];
      if (im.complete && im.naturalWidth) { const w = 1080 * z, h = 1920 * z; ctx.drawImage(im, (1080 - w) / 2 + dx, (1920 - h) / 2 + dy, w, h); }
    }
    tx.forEach(e => { if (t >= e.a && t < e.z) { if (e.a < 0) { e.style.opacity = 1; e.style.transform = "none"; } else pop(e, t, e.a, .75, 3, .6); } else e.style.opacity = 0; });
    pin.style.opacity = t < S1 ? 1 : 0; pin.style.transform = "translateX(-50%)";
    if (t >= S1 && t < S2) { pop(rw, t, S1, .6, 3, .55, "translateX(-50%)"); scan.style.opacity = 1; } else { rw.style.opacity = 0; scan.style.opacity = 0; }
    if (t >= TEN && t < S6) { pop(stamp, t, TEN, 2.2, 3.2, .5, `rotate(-12deg)`); } else stamp.style.opacity = 0;
    if (t >= S7) {
      pop(meme, t, S7, .4, 2.8, .45);
      [h1, h2].forEach((h, j) => { h.style.opacity = t >= S7 + .25 ? 1 : 0; const ph = (t - S7) * 7 + j * Math.PI; h.style.transform = `translateY(${(Math.sin(ph) * 70).toFixed(1)}px) rotate(${j ? 10 : -10}deg)`; });
      pop(be, t, S7 + .9, .6, 2.6, .5, "translateX(-50%)");
    } else { meme.style.opacity = 0; h1.style.opacity = 0; h2.style.opacity = 0; be.style.opacity = 0; }
    fl.style.opacity = t >= TEN && t < TEN + .1 ? (1 - (t - TEN) / .1) * .8 : (t >= S7 && t < S7 + .1 ? (1 - (t - S7) / .1) * .6 : 0);
  };
}, { push: 0, cut: true });
boot("six7c.m4a");
</script>
</body>
