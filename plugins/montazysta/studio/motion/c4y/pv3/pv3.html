<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>pv3 · Rozczarowany fotowoltaiką?</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<link rel="stylesheet" href="../lib/prem.css">
<link rel="stylesheet" href="../pv/pv.css">
</head>
<body>
<script src="../clips/manifest.js"></script>
<script src="timing.js"></script>
<script src="../lib/c4y.js"></script>
<script src="../lib/prem.js"></script>
<script>window.ACC = "#ff8a1f";</script>
<script src="../pv/pv.js"></script>
<script>
const DUR = T.DUR, S = k => LS(k);
const END = "blur(6px) brightness(.58) saturate(1.05)";
const tMi2 = W("c2", "miało", 1), tTy = W("c2", "ty"), tPon = W("c3", "poniżej"), tPrzes = W("c4", "przestała");
const tSpr = W("c5", "sprawdzamy"), tPot = W("c5", "potem"), tKlik = W("c7", "kliknij");
const ORANGE = "saturate(1.3) sepia(.22) contrast(1.06)";
const SHOTS = [
  { k: "img", s: "dom_zachod", a: 0, b: S("c2") - .04, z0: 1.02, z1: 1.12, ay0: .68, ay1: .62, mir: 1, f: ORANGE },
  { k: "img", s: "panele_brud", a: S("c2") - .04, b: tMi2 - .04, z0: 1.1, z1: 1.18, mir: 1, tr: "whip" },
  { k: "clip", s: "pv_bill", a: tMi2 - .04, b: tTy - .04, z0: 1.08, z1: 1.14, off: 1 },
  { k: "clip", s: "pv_worry", a: tTy - .04, b: S("c3") - .04, z0: 1.04, z1: 1.1 },
  { k: "img", s: "dom_zachod", a: S("c3") - .04, b: S("c5") - .04, z0: 1.1, z1: 1.18, ay0: .6, f: "blur(9px) brightness(.5) saturate(1.2)", tr: "fade", fd: .3 },
  { k: "clip", s: "pv_hands", a: S("c5") - .04, b: tSpr - .04, z0: 1.04, z1: 1.12, tr: "whip" },
  { k: "clip", s: "pv_meter", a: tSpr - .04, b: tPot - .04, z0: 1.04, z1: 1.12 },
  { k: "clip", s: "pv_hands", a: tPot - .04, b: S("c6") - .04, z0: 1.2, z1: 1.28, mir: 1, off: 3 },
  { k: "img", s: "dom_wieczor", a: S("c6") - .04, b: S("c7") - .04, z0: 1.0, z1: 1.1, ay0: .64, f: "saturate(1.12)", tr: "fade", fd: .45 },
  { k: "img", s: "dom_wieczor", a: S("c7") - .04, b: DUR + 1, z0: 1.1, z1: 1.16, ay0: .62, f: END, tr: "fade", fd: .5 },
];
scene(0, DUR + 1, (c) => {
  const draw = pvShots(c, SHOTS);
  el(c, "pv-shade"); el(c, "pv-vig");
  const ph = pvPhone(c, "day", { low: .32 });
  const cards = pvCards(c, [
    { a: 0, z: S("c2") - .04, now: 1, t: "ROZCZAROWANY / *FOTOWOLTAIKĄ?", size: 100, y: 280 },
    { a: S("c2") - .04, z: S("c3") - .04, t: "Nadal *dopłacasz / do prądu?", cls: "s", size: 92, y: 280 },
    { a: S("c3") - .04, z: S("c4") - .04, t: "Instalacja działa / *poniżej *możliwości", cls: "s", size: 76, y: 270 },
    { a: S("c4") - .04, z: S("c5") - .04, t: "A firma przestała / *odbierać?", cls: "s", size: 80, y: 270 },
    { a: S("c5") - .04, z: S("c6") - .04, t: "*BEZPŁATNY / PRZEGLĄD PV", size: 104, y: 280 },
    { a: S("c6") - .04, z: S("c7") - .04, t: "Niech instalacja / zacznie *zarabiać", cls: "s", y: 280 },
  ]);
  const end = pvEnd(c, "Umów przegląd instalacji");
  sfx("CLICK", tKlik, -18);
  return (lt, t) => {
    draw(t); cards(t);
    ph(t, { a: S("c3") + .05, z: S("c5") - .04, count: [S("c3") + .35, S("c3") + 1.5, 4.2], warn: tPon, call: S("c4") - .04, noAns: S("c4") + 1.2,
            log: [tPrzes - .05, tPrzes + .3, tPrzes + .65] });
    end(t, S("c7") - .04, tKlik);
  };
}, { push: 0, cut: true });
boot("pv3.m4a");
</script>
</body>
</html>
