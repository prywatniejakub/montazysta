<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>go4d10 · Zadzwoń, to się dowiesz (Go4Driver, styl spokojny)</title>
<link rel="stylesheet" href="../lib/c4y.css">
<link rel="stylesheet" href="../lib/g4d.css">
<link rel="stylesheet" href="../lib/g4s.css">
<style>
.wad .box { top: 250px; padding: 56px 56px 30px; }
.wad .hh { font: 900 100px/1.05 var(--d); color: #1d2a30; letter-spacing: -.03em; }
.wad .shout { font-size: 88px; margin-top: 18px; }
.wad .row { padding: 44px 0; font-size: 54px; }
.wad .row.hi { padding: 44px 26px; }
.call .end1 { bottom: 110px; }
.wad .row { transition: none; }
.sep { position: absolute; inset: 0; background: rgba(120,80,30,.0); mix-blend-mode: multiply; z-index: 3; pointer-events: none; }
</style>
</head>
<body>
<script src="../clips/manifest.js"></script>
<script src="timing.js"></script>
<script src="../lib/c4y.js"></script>
<script src="../lib/g4s.js"></script>
<script>
// STYL SPOKOJNY (2026-10-06): ujęcia ~3 s, przenikania, łagodne kadry, czyste napisy, mało efektów.
const DUR = T.DUR, S = G4.S;
const tKier = W("b1", "kierowca"), tSuper = W("b1", "Super"), tWyn = W("b2", "Wynagrodzenie"), tZadzwon = W("b2", "Zadzwoń");
const tZadz = W("b3", "Zadzwoniłem"), tPol = W("b3", "Pół"), tA = W("b4", "A"), tDwa = W("b4", "dwa");
const tNa = W("b5", "Na"), tKwot = W("b5", "kwotę"), tWid = W("b5", "widełki"), tZal = W("b6", "Załóż"), tKonto = W("b6", "konto"), tEnd = LE("b6") + .15;
const SHOTS = [
  [0, "face", { z: 1.1 }],
  [tKier - .1, "ad", { fade: 1 }],
  [tZadz - .15, "call", { fade: 1 }],
  [tA - .2, "face", { z: 1.18, fade: 1 }],
  [tNa - .2, "site", { fade: 1 }],
  [tZal - .2, "reg", { fade: 1 }],
  [tEnd, "end", { fade: 1 }],
];

scene(0, DUR + 1, c => {
  const L = {};
  L.face = G4.face(c, { clip: "go4d6av", fx: 542, fy: 806 });
  const sep = el(L.face, "sep");
  // zwykłe ogłoszenie bez stawki
  L.ad = el(c, "layer wad", `<div class="doc"><div class="box">
      <div class="hh">Kierowca C+E</div><div class="shout">Super warunki!</div>
      <div class="row" style="margin-top:30px">Lokalizacja<b>Polska, UE</b></div>
      <div class="row">System pracy<b>do ustalenia</b></div>
      <div class="row" id="pay">Wynagrodzenie<b>—</b></div>
      <div class="row">Kontakt<b>📞 512 *** ***</b></div></div></div>
    <div class="bar"><b>Ogłoszenia · Praca</b></div>`);
  const adoc = L.ad.querySelector(".doc"), pay = L.ad.querySelector("#pay"), payB = pay.querySelector("b"), shout = L.ad.querySelector(".shout");
  // rozmowa z licznikiem
  L.call = G4.call(c, "out");
  L.call.av.textContent = "R"; L.call.nm.textContent = "Rekruter · Transport";
  // prawdziwa strona: oferty z kwotami
  L.site = G4.site(c, "../g4site/home_top.jpg");
  const g1 = L.site.glow([97, 1840, 220, 48], 10), g2 = L.site.glow([97, 2151, 220, 48], 10);
  // prawdziwa rejestracja: „Kierowca - szukam pracy”
  L.reg = G4.site(c, "../g4site/register.jpg");
  const gK = L.reg.glow([41, 334, 141, 88], 8), gZ = L.reg.glow([41, 618, 293, 40], 10);
  const tapK = L.reg.finger(111, 378)(tZal + .35), tapZ = L.reg.finger(187, 638)(tKonto + .15);
  L.end = G4.end(c, "Każda oferta z kwotą albo widełkami.<br>Bez dzwonienia w ciemno.", "Załóż darmowe konto");
  // napisy + etykieta + rok
  const caps = G4.caps(c, [
    ["b1", "Ogłoszenie", "kierowca", "Ogłoszenie:"], ["b1", "kierowca", "Super", "kierowca C+E."], ["b1", "Super", null, "<span class='k'>Super warunki.</span>"],
    ["b2", "Wynagrodzenie", "Zadzwoń", "Wynagrodzenie?"], ["b2", "Zadzwoń", null, "„Zadzwoń, to się dowiesz.”"],
    ["b3", "Zadzwoniłem", "Pół", "Zadzwoniłem."], ["b3", "Pół", null, "Pół godziny gadania."],
    ["b4", "A", "dwa", "A stawka jak z"], ["b4", "dwa", null, "dwa tysiące dziesiątego."],
    ["b5", "Na", "każda", "Na Go4Driver"], ["b5", "każda", "kwotę", "każda oferta ma"], ["b5", "kwotę", null, "<span class='k'>kwotę albo widełki.</span>"],
    ["b6", "Załóż", "i", "Załóż <span class='k'>darmowe konto</span>"], ["b6", "i", null, "i nie dzwoń w ciemno."],
  ], true);
  const label = el(c, "label", "<i></i>Oferta pracy dla kierowcy");
  const yr = el(c, "yr", "<span>Stawka jak z <b>2026</b></span>"), yrB = yr.querySelector("b");
  const shots = G4.shots(L, SHOTS);
  G4.whooshes(SHOTS);
  sfx("CLICK", tZadzwon, -16); sfx("CLICK", tKwot + .1, -16); sfx("CLICK", tZal + .35, -12); sfx("CLICK", tKonto + .15, -12); sfx("IMP_SOFT", tEnd, -14);

  const ADCAM = [[tKier - .1, 0, 1], [tSuper, 0, 1.05], [tWyn - .1, 470, 1.12], [tZadz, 480, 1.14]];
  return (lt, t) => {
    const s = shots(t);
    const fs = s.cur === "face" ? s.shot : (s.prev === "face" ? s.prevShot : null);
    if (fs) L.face.draw(t, fs[2].z, fs[0]);
    // „2010”: delikatna sepia i rok przewijany do tyłu
    const old = P(t, tDwa - .1, tDwa + .5);
    sep.style.background = `rgba(150,110,60,${(.28 * old).toFixed(3)})`;
    if (t >= tDwa - .1 && t < tNa - .2) { yr.style.opacity = Math.min(E.out(clamp((t - tDwa + .1) / .3)), clamp((tNa - .2 - t) / .2)); yr.style.transform = `translateY(${(1 - E.out(clamp((t - tDwa + .1) / .3))) * 16}px)`;
      yrB.textContent = String(Math.round(mix(2026, 2010, E.io(clamp((t - tDwa) / .9))))); } else yr.style.opacity = 0;
    // ogłoszenie: spokojny najazd na „Super warunki”, potem na wynagrodzenie
    const [ay, as] = G4.keyAt(ADCAM, t, .9);
    adoc.style.transform = `translateY(${(-ay * as).toFixed(1)}px) scale(${as.toFixed(4)})`;
    shout.style.color = t >= tSuper ? "#e5383b" : "#1d2a30";
    pay.classList.toggle("hi", t >= tZadzwon); payB.textContent = t >= tZadzwon ? "Zadzwoń, to się dowiesz" : "—";
    // rozmowa: licznik do 31:47
    const ct = t < tPol ? Math.max(0, (t - tZadz) * 1.4) : mix((tPol - tZadz) * 1.4, 1907, E.io(clamp((t - tPol) / 1.1)));
    L.call.nr.textContent = `${String(Math.floor(ct / 60)).padStart(2, "0")}:${String(Math.floor(ct % 60)).padStart(2, "0")}`;
    L.call.pulse(t, tZadz); L.call.ring.style.opacity = .25 * (1 - ((t - tZadz) * .7) % 1);
    // strona: oferty z kwotami, spokojne przewijanie i podświetlenie kwot
    L.site.cam(G4.keyAt([[tNa - .2, 1560], [tWid + .5, 1700]], t, 3)[0]);
    g1.style.opacity = clamp((t - tKwot) / .3); g2.style.opacity = clamp((t - tWid) / .3);
    // rejestracja
    L.reg.cam(0, G4.keyAt([[tZal - .2, 1], [tEnd, 1.05]], t, 2.5)[0], 378);
    gK.style.opacity = clamp((t - tZal - .4) / .25); gZ.style.opacity = clamp((t - tKonto - .2) / .25); tapK(t); tapZ(t);
    L.end.upd(t, tEnd + .2);
    caps(t, tEnd);
    label.style.opacity = t < tKier - .1 ? 1 : clamp(1 - (t - tKier + .1) / .3);
  };
}, { push: 0, cut: true });
boot("go4d10.m4a");
</script>
</body>
</html>
