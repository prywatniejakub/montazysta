<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>fmb1 · W dzień oddajesz, wieczorem kupujesz</title>
<link rel="stylesheet" href="../lib/prem.css">
<link rel="stylesheet" href="../zsz/zs.css">
<link rel="stylesheet" href="../oze/oze.css">
</head>
<body>
<script src="../clips/manifest.js"></script>
<script src="timing.js"></script>
<script src="../lib/c4y.js"></script>
<script src="../lib/prem.js"></script>
<script src="../zsz/zs.js"></script>
<script src="../oze/oze.js"></script>
<script>
const DUR = T.DUR, S = k => LS(k);
const BLUR = "blur(14px) brightness(.5) saturate(.8)";
const tOdd = W("a1", "oddaja"), tPan = W("a1", "panele"), tPod = W("a5", "podpiac"), tZero = W("a6", "zero");
const tF = W("a7", "falownik"), tM = W("a7", "moc"), tWiek = W("a7", "wiek"), tOdz = W("a9", "oddzwonimy");
const SHOTS = [
  { k: "clip", s: "oz_estate", a: 0, b: tPan + .25, z0: 1.12, push: .1 },
  { k: "clip", s: "oz_panel1", a: tPan + .25, b: S("a2") - .04, z0: 1.08 },
  { k: "clip", s: "oz_evening", a: S("a2") - .04, b: S("a3") - .04, z0: 1.1, whip: 1 },
  { k: "clip", s: "oz_sunset", a: S("a3") - .04, b: S("a4") - .04, z0: 1.08 },
  { k: "clip", s: "oz_bluehour", a: S("a4") - .04, b: S("a5") - .04, z0: 1.1, f: BLUR, fade: .3 },
  { k: "clip", s: "oz_sky", a: S("a5") - .04, b: S("a6") - .04, z0: 1.1, f: BLUR, fade: .3 },
  { k: "clip", s: "oz_meter", a: S("a6") - .04, b: S("a7") - .04, z0: 1.06, whip: 1 },
  { k: "clip", s: "oz_panel4", a: S("a7") - .04, b: S("a8") - .04, z0: 1.1, f: BLUR, fade: .3 },
  { k: "clip", s: "oz_tykocin", a: S("a8") - .04, b: S("a9") - .04, z0: 1.12, push: .08, whip: -1 },
  { k: "clip", s: "oz_zakop", a: S("a9") - .04, b: DUR + 1, z0: 1.1, f: BLUR, fade: .35 },
];
const HI = /^(panele|wieczorem|drożej|net-billing|magazyn|wieczór|falownika|podpiąć|0|zł|falownik|moc|wiek|wizycie|formularzu|oddzwonimy)/i;
scene(0, DUR + 1, (c) => {
  const draw = zsShots(c, SHOTS);
  el(c, "p-shade");
  const sun = ozPrice(c, "sun", 300, "☀️", "W DZIEŃ ODDAJESZ", "TANIO", "↓");
  const moon = ozPrice(c, "snow", 560, "🌙", "WIECZOREM KUPUJESZ", "DROŻEJ", "↑");
  const bat = ozBattery(c), inv = ozInverter(c);
  const zero = ozBadge(c, "AUDYT 0 ZŁ", 220);
  const steps = ozSteps(c, ["FALOWNIK", "MOC", "WIEK INSTALACJI"]);
  const ph = ozPhone(c);
  premCaps(c, ozWords(zsWords({}, [["zero", "złotych", "0 zł"]])), { chars: 14, hi: w => HI.test(w) ? OY : null });
  sfx("POP", tOdd, -16); sfx("POP", S("a2") + .3, -16); sfx("IMP_SOFT", S("a4"), -16); sfx("POP", tPod, -15); sfx("DING", S("a6") + .3, -15);
  [tF, tM, tWiek].forEach(x => sfx("POP", x, -15)); sfx("POP", tOdz - .15, -14); sfx("DING", tOdz + .45, -16);
  return (lt, t) => {
    draw(t);
    sun(t, tOdd - .05, S("a4") - .05);
    moon(t, S("a2") + .25, S("a4") - .05);
    bat(t, S("a4") - .04, S("a5") - .04, W("a4", "wieczor"));
    inv(t, S("a5") - .04, S("a6") - .04, 1e9, tPod - .1);
    zero(t, S("a6") + .3, tZero - .1);
    steps(t, [tF, tM, tWiek], S("a8") - .05);
    ph(t, S("a9") - .04, DUR + 1, tOdz - .15, tOdz + .45);
    premCapsUpdate(t);
  };
}, { push: 0, cut: true });
boot("fmb1.m4a");
</script>
</body>
</html>
