<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Motion Showreel</title>
<style>
@font-face { font-family: "SUV"; src: url("SegUIVar.ttf"), url("file:///C:/Windows/Fonts/SegUIVar.ttf"); font-weight: 300 700; }
:root {
  --font: "SUV", "Segoe UI Variable Display", "Segoe UI", sans-serif;
  --mono: Consolas, "Cascadia Mono", monospace;
  --ink: #f4f6fb; --dim: #8b93a7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04050a; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; font-variation-settings: "opsz" 36; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #04050a; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.blob { position: absolute; left: 0; top: 0; width: 1900px; height: 1900px; margin: -950px 0 0 -950px; border-radius: 50%; opacity: 0; }
.scene { position: absolute; inset: 0; perspective: 1600px; display: none; }
.world, .g { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.world { left: 960px; top: 540px; }
.abs { position: absolute; }
.t { color: var(--ink); white-space: nowrap; letter-spacing: -0.03em; }
.w { display: inline-block; white-space: nowrap; }
.c { display: inline-block; }
.gtext { display: inline-block; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-repeat: no-repeat; background-size: 250% 100%, 100% 100%; padding: 0 .06em; }
.g1 { background-image: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%), linear-gradient(90deg, #7fb0ff, #a98bff 50%, #f3a6ff); }
.g2 { background-image: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%), linear-gradient(90deg, #5ee7ff, #4f8cff 60%, #8b6cff); }
.gold { background-image: linear-gradient(100deg, transparent 40%, rgba(255,255,255,1) 50%, transparent 60%), linear-gradient(180deg, #fff6dc 0%, #f1d08a 38%, #b98a3e 62%, #f7e2a8 100%); }
.silver { background-image: linear-gradient(100deg, transparent 40%, rgba(255,255,255,1) 50%, transparent 60%), linear-gradient(180deg, #ffffff 0%, #dfe6f5 45%, #8e9bb8 70%, #eef2ff 100%); }

/* fx */
#flash { background: #cfe0ff; mix-blend-mode: screen; opacity: 0; }
#streak { position: absolute; left: 50%; top: 50%; width: 2600px; height: 240px; margin: -120px 0 0 -1300px; opacity: 0; mix-blend-mode: screen; }
#streak i { position: absolute; left: 0; right: 0; top: 50%; }
#streak .core { height: 4px; margin-top: -2px; background: linear-gradient(90deg, transparent, rgba(140,180,255,.0) 8%, rgba(210,228,255,1) 50%, rgba(140,180,255,0) 92%, transparent); filter: blur(1px); }
#streak .halo { height: 60px; margin-top: -30px; background: linear-gradient(90deg, transparent, rgba(80,130,255,.35) 30%, rgba(160,190,255,.55) 50%, rgba(80,130,255,.35) 70%, transparent); filter: blur(22px); }
#vig { background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.62) 100%); }
#fade { background: #000; opacity: 0; }

/* code window */
.win { border-radius: 20px; overflow: hidden;
  background: linear-gradient(180deg, rgb(26,30,44), rgb(11,13,21));
  border: 1px solid rgba(255,255,255,.11);
  box-shadow: 0 50px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
.win .bar { height: 50px; display: flex; align-items: center; gap: 9px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.025); }
.win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; }
.win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
.win .tab { margin-left: 16px; font: 15px var(--mono); color: #9aa6c2; padding: 6px 14px; background: rgba(255,255,255,.06); border-radius: 8px; }
.code { font: 27px/1.6 var(--mono); padding: 22px 30px; color: #eeffff; white-space: pre; letter-spacing: 0; }
.code .ln { display: inline-block; width: 44px; color: #3b4560; }
.kw { color: #c792ea; } .fn { color: #82aaff; } .str { color: #c3e88d; } .num { color: #f78c6c; }
.key { color: #89ddff; } .id { color: #eef3ff; } .op { color: #8a9cc4; } .cm { color: #56637f; font-style: italic; }
.caret { display: inline-block; width: 14px; height: 30px; background: #82aaff; vertical-align: -5px; margin-left: 2px; box-shadow: 0 0 14px #4f8cff; }
.wglow { border-radius: 50%; background: radial-gradient(closest-side, rgba(70,120,255,.45), transparent); filter: blur(30px); }

/* layers (exploded stack) */
.lay { border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); background: rgba(16,20,32,.30); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.lay img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; display: block; }
.lay .mk { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; }
.lay .tagl { position: absolute; left: 22px; top: 18px; font: 600 17px var(--font); letter-spacing: .14em; color: rgba(255,255,255,.75); }
.cap { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 700 58px var(--font); letter-spacing: -.02em; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
.cap b { color: #ffd84a; }
.clabel { position: absolute; left: 0; top: 0; display: flex; align-items: center; opacity: 0; }
.clabel .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #8fb4ff; margin-left: -5px; }
.clabel .ln2 { height: 1px; width: 90px; background: linear-gradient(90deg, rgba(255,255,255,.8), rgba(255,255,255,.25)); transform-origin: 0 50%; }
.clabel span { margin-left: 16px; font: 500 26px var(--font); color: #e9eefb; letter-spacing: -.01em; white-space: nowrap; }
.clabel span b { font-weight: 600; color: #7fa6ff; margin-right: 10px; font-variant-numeric: tabular-nums; }

/* tip cards (grid) */
.tip { border-radius: 16px; overflow: hidden; background: linear-gradient(160deg, rgba(23,27,33,.97), rgba(8,10,13,.99)); border: 1px solid rgba(255,255,255,.07); }

.tip .lbl { position: absolute; left: 22px; top: 15px; font: 400 19px var(--font); color: #8a909c; }
.tip .rule { position: absolute; left: 22px; right: 38%; top: 47px; height: 1px; background: rgba(255,255,255,.10); }
.tip .mask { position: absolute; left: 22px; right: 18px; top: 60px; font: 600 24px var(--font); color: #9aa0a8; letter-spacing: .02em; white-space: nowrap; }
.tip .pills { position: absolute; left: 22px; bottom: 16px; display: flex; gap: 4px; }
.tip .pills i { width: 11px; height: 21px; border-radius: 6px; border: 1.6px solid #8f959e; transform: rotate(28deg); }
.tip .pills i.on { background: #c9ced6; border-color: #c9ced6; }
.tip .sweep { position: absolute; top: -30%; bottom: -30%; left: 0; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.16), transparent); transform: translateX(-150%); }
.dtitle { display: flex; align-items: center; justify-content: center; gap: 22px; font: 600 70px var(--font); letter-spacing: -.03em; color: #eef2fb; text-shadow: 0 0 40px rgba(140,170,255,.25); }
.dtitle svg { width: 62px; height: 62px; filter: drop-shadow(0 0 18px rgba(110,150,255,.8)); }

/* title */
.ext { font: 700 250px/280px var(--font); letter-spacing: -.035em; text-align: center; white-space: nowrap; }
.rays { border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(130,170,255,.16) 0deg 1.6deg, transparent 1.6deg 11deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 10%, transparent 80%); }
.hglow { border-radius: 50%; background: radial-gradient(closest-side, rgba(70,120,255,.55), rgba(90,60,255,.18) 55%, transparent); filter: blur(20px); }

/* chapter card */
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.chap { border-radius: 28px; overflow: hidden; background: linear-gradient(155deg, rgba(24,29,36,.98), rgba(7,9,12,.99)); border: 1px solid rgba(140,255,180,.22); box-shadow: 0 60px 140px rgba(0,0,0,.6), 0 0 60px rgba(60,220,120,.12); }
.chap .glow { position: absolute; inset: 0; background: radial-gradient(90% 120% at 90% 110%, rgba(46,180,90,.55), transparent 60%), radial-gradient(60% 80% at 0% 0%, rgba(80,120,255,.18), transparent 60%); }
.chap .pill { position: absolute; left: 56px; top: 50px; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 40px; background: rgba(120,255,170,.08); border: 1px solid rgba(120,255,170,.25); font: 600 19px var(--font); letter-spacing: .2em; color: #b9f5cc; }
.chap .pill i { width: 9px; height: 9px; border-radius: 50%; background: #54e38a; box-shadow: 0 0 10px #54e38a; }
.chap .ttl { position: absolute; left: 56px; top: 140px; font: 650 82px/1.02 var(--font); letter-spacing: -.035em; color: #f7f9fc; }
.chap .sub { position: absolute; left: 58px; top: 330px; font: 400 28px var(--font); color: #9aa3b5; letter-spacing: -.005em; }
.chap .mini { position: absolute; right: 56px; top: 64px; width: 250px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chap .mini i { height: 62px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
.chap .mini i.on { background: linear-gradient(135deg, rgba(84,227,138,.45), rgba(84,227,138,.12)); border-color: rgba(120,255,170,.6); box-shadow: 0 0 24px rgba(84,227,138,.35); }
.chap .prog { position: absolute; left: 58px; right: 190px; bottom: 58px; display: flex; gap: 8px; }
.chap .prog i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); }
.chap .prog i.on { background: linear-gradient(90deg, #3fcf7a, #7ef0a8); box-shadow: 0 0 12px rgba(84,227,138,.5); }
.chap .pnum { position: absolute; right: 56px; bottom: 44px; font: 600 30px var(--font); color: #dfe6f0; font-variant-numeric: tabular-nums; }

/* stats panel */
.panel { border-radius: 28px; overflow: hidden; background: linear-gradient(165deg, rgba(24,28,40,.96), rgba(9,11,18,.98)); border: 1px solid rgba(255,255,255,.10); box-shadow: 0 60px 140px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07); }
.panel .glow { position: absolute; inset: 0; background: radial-gradient(80% 90% at 85% 100%, rgba(60,120,255,.35), transparent 60%); }
.panel .plabel { position: absolute; left: 56px; top: 44px; font: 600 26px var(--font); color: #dfe5f2; }
.panel .plabel span { color: #6f7890; font-weight: 400; }
.odo { position: absolute; left: 50px; top: 92px; display: flex; font: 700 150px/150px var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.odo .col { height: 150px; overflow: hidden; width: .6em; text-align: center; }
.odo .sp { width: .22em; }
.odo .strip { display: flex; flex-direction: column; }
.delta { position: absolute; right: 60px; top: 150px; padding: 12px 22px; border-radius: 40px; font: 700 30px var(--font); color: #7ef0a8; background: rgba(84,227,138,.12); border: 1px solid rgba(84,227,138,.35); box-shadow: 0 0 30px rgba(84,227,138,.2); }
.chart { position: absolute; left: 40px; bottom: 30px; width: 1100px; height: 250px; overflow: visible; }

/* premium cards */
.pcard { border-radius: 26px; overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.14); }
.pc0 { background: linear-gradient(135deg, #07163a 0%, #1848c9 55%, #6fb1ff 100%); }
.pc1 { background: linear-gradient(135deg, #1d0838 0%, #6d2fe0 50%, #f472b6 100%); }
.pc2 { background: linear-gradient(135deg, #15171c 0%, #4d535f 50%, #d5dae3 100%); }
.pcard .lines { position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px); mix-blend-mode: overlay; }
.pcard .sheen { position: absolute; inset: -10%; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.33) 46%, rgba(255,255,255,.08) 54%, transparent 68%); background-size: 300% 100%; mix-blend-mode: screen; }
.pcard .brand { position: absolute; left: 36px; top: 30px; font: 600 24px var(--font); color: rgba(255,255,255,.88); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.pcard .brand svg { width: 22px; height: 22px; }
.pcard .chip { position: absolute; right: 36px; top: 30px; width: 58px; height: 44px; border-radius: 9px; background: linear-gradient(135deg, #f6e3a1, #b88d3a 60%, #f3dd98); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.pcard .chip::before { content: ""; position: absolute; inset: 9px 0; border-top: 1px solid rgba(0,0,0,.25); border-bottom: 1px solid rgba(0,0,0,.25); }
.pcard .nm { position: absolute; left: 36px; bottom: 28px; font: 650 50px var(--font); letter-spacing: -.03em; color: #fff; }
.pcard .no { position: absolute; right: 36px; bottom: 34px; font: 500 24px var(--mono); color: rgba(255,255,255,.7); }

/* reels */
.reel { border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); background: #111; box-shadow: 0 40px 90px rgba(0,0,0,.5); }
.reel img { width: 100%; height: 100%; object-fit: cover; display: block; }
.floor { border-radius: 50%; background: radial-gradient(closest-side, rgba(90,130,255,.35), transparent); filter: blur(20px); }

/* kinetic */
.big { font: 700 260px/300px var(--font); letter-spacing: -.045em; text-align: center; }
.sline { position: absolute; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(190,215,255,.85), transparent); opacity: 0; }
.spark { width: 60px; height: 60px; }

/* hero */
.ed { position: absolute; left: 0; right: 0; top: 50px; bottom: 0; }
.pv { position: absolute; left: 22px; top: 20px; width: 600px; height: 338px; border-radius: 12px; overflow: hidden; background: #000; }
.pv img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
.pv .tc { position: absolute; right: 12px; bottom: 10px; font: 600 16px var(--mono); color: #fff; background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 6px; }
.insp { position: absolute; left: 642px; right: 22px; top: 20px; height: 338px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); padding: 18px 18px; }
.insp h4 { font: 600 17px var(--font); color: #cfd6e6; margin-bottom: 16px; letter-spacing: .02em; }
.insp .row { display: flex; align-items: center; justify-content: space-between; font: 400 15px var(--font); color: #8b93a7; margin-bottom: 14px; }
.insp .sl { width: 130px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); position: relative; }
.insp .sl i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #4f8cff, #8b6cff); }
.tl { position: absolute; left: 22px; right: 22px; top: 376px; bottom: 20px; border-radius: 12px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.05); overflow: hidden; }
.tl .tr { position: absolute; left: 12px; right: 12px; height: 22px; }
.tl .clip { position: absolute; top: 0; bottom: 0; border-radius: 6px; font: 600 12px var(--font); color: rgba(255,255,255,.9); padding: 3px 8px; white-space: nowrap; overflow: hidden; }
.tl .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }
.mini-stat { border-radius: 22px; background: linear-gradient(165deg, rgba(24,28,40,.96), rgba(9,11,18,.98)); border: 1px solid rgba(255,255,255,.1); overflow: hidden; }

.reel .ui { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.reel .ui b { position: absolute; left: 18px; bottom: 44px; font: 600 16px var(--font); color: #fff; }
.reel .ui span { position: absolute; left: 18px; bottom: 20px; font: 400 14px var(--font); color: rgba(255,255,255,.8); }

/* logo */
.wm { font: 650 118px/140px var(--font); letter-spacing: -.035em; white-space: nowrap; }
.tag { font: 400 38px var(--font); color: #9aa3b8; letter-spacing: -.01em; text-align: center; white-space: nowrap; }
.meta { font: 400 21px var(--font); color: #5d6579; letter-spacing: .06em; text-align: center; white-space: nowrap; }
</style>

</div>
<svg width="0" height="0" style="position:absolute"><defs id="defs">

    <stop offset="0" stop-color="#5aa0ff"/><stop offset=".55" stop-color="#8f7bff"/><stop offset="1" stop-color="#e38bff"/>
  </linearGradient>
</defs></svg>
<script>
"use strict";
// ---------------------------------------------------------------- utils

}

}

  Kph.style.left = `${mix(8, 92, P(t, t0, END, E.lin))}%`;
  lightCard(Ktip, t, t0 + .5);
  reveal(Kh.chars, t, t0 + .35, { stagger: .018, dur: .8, y: 20, blur: 12 });
  conceal(Kh.chars, t, END - .2, { stagger: .006, y: -20 });
  Ks.el.style.filter = ex > .02 ? `blur(${ex * 18}px)` : "";
};

// ================================================================ L: logo
const Ls = scene("L", END - .02, 24.61);
const Lg = grp(Ls.world);
const Lhalo = box(Lg, "hglow", 900, 520);
const Lstar = box(Lg, "", 150, 150, SPARK);
Lstar.style.filter = "drop-shadow(0 0 30px rgba(120,150,255,.8))";
const Lwm = box(Lg, "wm", 760, 140, '<span class="gtext silver">WEFMI Studio</span>');
const Lwms = Lwm.firstChild;
const Ltag = textBox(Lg, "Montaż premium. Pisany kodem.", 38, 400, 1400, "center", true); Ltag.classList.add("tag");
const Lmeta = textBox(Ls.el, "WYRENDEROWANE KLATKA PO KLATCE · HTML · CSS 3D · FFMPEG", 21, 400, 1400, "center", true);
Lmeta.classList.add("meta"); Lmeta.style.left = "260px"; Lmeta.style.top = "960px";
Ls.update = t => {
  const s = spring(t - END, 1.1, .5);
  tf(Lg, `scale(${mix(.97, 1.03, P(t, END, 24.6, E.outCubic))})`);
  tf(Lstar, `translate3d(-392px,-20px,0) rotate(${(1 - clamp(s)) * -120}deg) scale(${Math.max(0, s)})`);
  tf(Lhalo, `translate3d(-392px,-20px,-50px) scale(${.6 + .6 * P(t, END, END + 1.2)})`);
  Lhalo.style.opacity = .25 + .6 * pulse(t, END, .8);
  const wu = P(t, END + .28, END + 1.25, E.outCubic);
  tf(Lwm, `translate3d(${100 - (1 - wu) * 40}px,-20px,0)`);
  Lwm.style.textAlign = "left";
  wipe(Lwms, wu, .3);
  Lwms.style.filter = wu > .99 ? "" : `blur(${(1 - wu) * 12}px)`;
  sheen(Lwms, P(t, END + 1.1, END + 2.3, E.inOutSine));
  tf(Ltag, "translate3d(0,108px,0)");
  reveal(Ltag.chars, t, END + .95, { stagger: .02, dur: .9, y: 16, blur: 10 });
  reveal(Lmeta.chars, t, END + 1.7, { stagger: .008, dur: .8, y: 0, blur: 8 });
};

// ---------------------------------------------------------------- render
window.render = t => {
  bgUpdate(t);
  fxUpdate(t);
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    if (on !== s.on) { s.el.style.display = on ? "block" : "none"; s.on = on; }
    if (on) s.update(t);
  }
  return true;
};

// ---------------------------------------------------------------- boot
(async () => {
  try { await document.fonts.load('600 40px "SUV"'); } catch (e) {}
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.render(0);
  window.FONT_OK = document.fonts.check('600 40px "SUV"');
  window.READY = true;
})();
// preview: plain open plays in a loop scaled to the window; ?t=5.2 freezes a frame; ?render = renderer mode
const q = new URLSearchParams(location.search);
function fitStage() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080), ox = (innerWidth - 1920 * s) / 2, oy = (innerHeight - 1080 * s) / 2;
  const st = document.getElementById("stage");
  st.style.transformOrigin = "0 0";
  st.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
  window.STAGE = { s, ox, oy };
  document.documentElement.style.background = document.body.style.background = "#000";
  document.documentElement.style.width = document.body.style.width = "100vw";
  document.documentElement.style.height = document.body.style.height = "100vh";
}
if (!q.has("render")) { fitStage(); addEventListener("resize", fitStage); }
if (q.has("t")) { const go = () => window.READY ? window.render(+q.get("t")) : setTimeout(go, 50); go(); }
else if (!q.has("render")) {
  let st = performance.now();
  addEventListener("click", () => { st = performance.now(); });
  const loop = () => { if (window.READY) window.render(((performance.now() - st) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
